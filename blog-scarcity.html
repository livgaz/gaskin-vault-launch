<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Structural Scarcity — Bagfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>



/*
 * ═══════════════════════════════════════════════════════════════
 *  BAGFOLIO — RESPONSIVE CSS  (Mobile-First)
 *  Structure:
 *   1. Custom Properties (Root Variables)
 *   2. Reset & Base
 *   3. Typography
 *   4. Navigation  ← mobile base, then desktop override at bottom
 *   5. Layout Utilities
 *   6. Components  (hero, stats, ticker, cards, footer …)
 *   7. Page-specific sections
 *   8. @media (min-width: 1024px)  ← ALL desktop overrides live here
 * ═══════════════════════════════════════════════════════════════
 */

/* ─────────────────────────────────────────────
   1. CUSTOM PROPERTIES
   ───────────────────────────────────────────── */
:root {
  /* Brand colours */
  --white:  #ffffff;
  --off:    #f9f8f6;
  --ink:    #111111;
  --mid:    #5a5a5a;
  --faint:  #a8a8a8;
  --rule:   #dddddd;
  --pk:     #e8a0b4;   /* Gaskin Pink — primary accent */
  --pk2:    #fdf0f4;   /* pink tint background */
  --pkd:    #d4809a;   /* pink dark — hover / active */
  --gold:   #c8a96e;

  /* Typography */
  --font-serif: 'Cormorant Garamond', Georgia, serif;
  --font-mono:  'DM Mono', 'Courier New', monospace;

  /* Spacing scale */
  --sp-xs:  0.5rem;
  --sp-sm:  1rem;
  --sp-md:  1.5rem;
  --sp-lg:  2.5rem;
  --sp-xl:  4rem;

  /* Nav height tokens — overridden at desktop */
  --nav-h:  auto;      /* mobile: natural height */
}

/* ─────────────────────────────────────────────
   2. RESET & BASE
   ───────────────────────────────────────────── */
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Fix iPhone horizontal shake / overflow */
html {
  scroll-behavior: smooth;
  overflow-x: hidden;
  max-width: 100%;
  /* Prevent font size inflation on iOS */
  -webkit-text-size-adjust: 100%;
  /* Belt-and-braces: kill any UA margin/padding at root */
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-mono);
  background: var(--white);
  color: var(--ink);
  overflow-x: hidden;
  max-width: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  /* Eliminate any browser-default body margin/padding that causes nav gap */
  margin: 0;
  padding: 0;
}

img,
svg,
video {
  max-width: 100%;
  height: auto;
  display: block;
}

a {
  color: inherit;
  text-decoration: none;
}

ul {
  list-style: none;
}

/* ─────────────────────────────────────────────
   3. TYPOGRAPHY HELPERS
   ───────────────────────────────────────────── */
.serif  { font-family: var(--font-serif); }
.mono   { font-family: var(--font-mono); }

.label {
  font-size: 0.58rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--faint);
}

/* Pink accent — used on headings, links, decorative pips */
.accent      { color: var(--pk); }
.accent-dark { color: var(--pkd); }

/* ─────────────────────────────────────────────
   4. NAVIGATION  (Mobile base — stacks vertically)
   ───────────────────────────────────────────── */
.sys-bar {
  /* Solid background — prevents ghost/transparent nav */
  background-color: var(--white);
  border-bottom: 1px solid var(--rule);

  /* Pinned to the very top of the viewport — no gap, ever */
  position: sticky;
  top: 0 !important;
  margin-top: 0 !important;
  left: 0;
  right: 0;
  z-index: 9999;

  /* Mobile: stack logo above links */
  display: flex;
  flex-direction: column;
  align-items: stretch;
  width: 100%;
  height: var(--nav-h);   /* auto on mobile */
}

/* Logo row */
.sys-bar-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.72rem 1rem;
  border-bottom: none;           /* border comes from sys-bar itself */
  min-height: 48px;              /* consistent touch target */
}

.sys-logo {
  font-family: var(--font-serif);
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--ink);
  text-decoration: none;
  flex-shrink: 0;
}

/* Pink italic word in logo */
.sys-logo span {
  color: var(--pk);
  font-style: italic;
  font-weight: 300;
}

/* Hamburger button — visible on mobile only */
.nav-toggle {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  width: 28px;
  height: 28px;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 2px;
  flex-shrink: 0;
}
.nav-toggle span {
  display: block;
  width: 100%;
  height: 1.5px;
  background: var(--ink);
  transition: transform 0.2s ease, opacity 0.2s ease;
}
/* Open state */
.nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

/* Nav links — hidden on mobile until toggled */
.sys-nav {
  display: none;           /* hidden by default on mobile */
  flex-direction: column;
  background-color: var(--white);
  border-bottom: 1px solid var(--rule);
}
.sys-nav.is-open {
  display: flex;
  border-top: 1px solid var(--rule);   /* separator between logo and open menu */
}

.sys-nav a {
  font-size: 0.6rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mid);
  text-decoration: none;
  padding: 0.85rem 1rem;
  border-bottom: 1px solid var(--rule);
  transition: color 0.18s, background 0.18s;
}
.sys-nav a:last-child {
  border-bottom: none;
}
.sys-nav a:hover,
.sys-nav a.active {
  color: var(--ink);
  background: var(--off);
}
.sys-nav a.active {
  color: var(--pkd);
}

/* CTA pill inside nav (Buy the Guide) */
.sys-action {
  display: block;
  font-size: 0.58rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  background: var(--ink);
  color: var(--white);
  text-decoration: none;
  text-align: center;
  padding: 0.9rem 1rem;
  margin: 0.75rem 1rem;
  border-radius: 0;
  transition: background 0.18s;
  white-space: nowrap;
}
.sys-action:hover { background: var(--pkd); }

/* ─────────────────────────────────────────────
   5. LAYOUT UTILITIES
   ───────────────────────────────────────────── */
.container {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 1rem;
}

/* Generic section top-padding compensates for sticky nav on mobile */
.page-section {
  padding: 2.5rem 1rem;
}

/* Horizontal rule between sections */
.section-rule {
  border: none;
  border-top: 1px solid var(--rule);
  margin: 0;
}

/* Section header bar (label left / count right) */
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.9rem 1rem;
  border-bottom: 1px solid var(--rule);
}
.sh-label {
  font-size: 0.56rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mid);
}
.sh-count {
  font-size: 0.54rem;
  letter-spacing: 0.14em;
  color: var(--faint);
  font-style: italic;
  font-family: var(--font-serif);
}

/* ─────────────────────────────────────────────
   6. COMPONENTS
   ───────────────────────────────────────────── */

/* ── Buttons ──────────────────────────────── */
.btn-primary {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  background: var(--ink);
  color: var(--white);
  padding: 0.9rem 1.8rem;
  text-decoration: none;
  border: 1px solid var(--ink);
  transition: background 0.2s, border-color 0.2s;
  white-space: nowrap;
  cursor: pointer;
}
.btn-primary:hover { background: var(--pkd); border-color: var(--pkd); }

.btn-ghost {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--mid);
  padding: 0.88rem 1.6rem;
  text-decoration: none;
  border: 1px solid var(--rule);
  background: transparent;
  transition: border-color 0.2s, color 0.2s;
  white-space: nowrap;
  cursor: pointer;
}
.btn-ghost:hover { border-color: var(--ink); color: var(--ink); }

.btn-pink {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.58rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  background: var(--pk);
  color: var(--white);
  padding: 0.75rem 1.8rem;
  text-decoration: none;
  border: none;
  transition: opacity 0.2s;
  cursor: pointer;
}
.btn-pink:hover { opacity: 0.85; }

/* ── Pip / decorative dot ─────────────────── */
.pip {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--pk);          /* always pink */
  flex-shrink: 0;
}

/* ── Hero (Intelligence Hub) ──────────────── */
.hero {
  /* Mobile: single column */
  display: flex;
  flex-direction: column;
  min-height: auto;
  border-bottom: 1px solid var(--rule);
}

.hero-l {
  padding: 2.5rem 1rem 2rem;
  border-bottom: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  gap: 0.75rem;                   /* reduced — lets margin on child elements control spacing */
}

.hero-eyebrow {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 0.56rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--faint);
}

/* The big price — always pink, always prominent */
.hero-price-display {
  font-family: var(--font-serif);
  font-size: clamp(3.5rem, 12vw, 5.5rem);
  font-weight: 300;
  color: var(--pk);               /* Gaskin Pink — preserved */
  line-height: 0.9;               /* tighter — visually raises the number */
  letter-spacing: -0.02em;
  margin-bottom: -0.2rem;         /* pull 'ONE-TIME PURCHASE' note up */
}

.hero-price-note {
  font-size: 0.54rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--faint);
  margin-top: 0.15rem;            /* small breathing gap under price */
  margin-bottom: 0.6rem;          /* clear gap before headline starts */
}

.hero-title {
  font-family: var(--font-serif);
  font-size: clamp(2.6rem, 8vw, 5rem);
  font-weight: 300;
  line-height: 1.04;
  letter-spacing: -0.01em;
}
.hero-title em {
  font-style: italic;
  color: var(--pk);               /* Pink on italic words */
}

.hero-sub {
  font-size: 0.78rem;
  line-height: 1.85;
  color: var(--mid);
  font-weight: 300;
  max-width: 40ch;
}

.hero-cta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  align-items: center;
}

/* Hero right panel — report card */
.hero-r {
  background: var(--off);
  padding: 2rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}
.hero-r-label {
  font-size: 0.54rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--faint);
}

/* ── Report card ──────────────────────────── */
.report-card {
  background: var(--white);
  border: 1px solid var(--rule);
  padding: 1.8rem;
}
.rc-price-display {
  font-family: var(--font-serif);
  font-size: clamp(3rem, 10vw, 5rem);
  font-weight: 300;
  color: var(--pk);               /* Pink price — always */
  line-height: 1;
  margin-bottom: 0.15rem;
}
.rc-price-label {
  font-size: 0.52rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--faint);
}
.rc-rule {
  border: none;
  border-top: 1px solid var(--rule);
  margin: 1.2rem 0;
}
.rc-title {
  font-family: var(--font-serif);
  font-size: 1.2rem;
  font-weight: 400;
  line-height: 1.25;
}
.rc-title em { font-style: italic; color: var(--pk); }
.rc-meta {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--rule);
  margin-top: 1.2rem;
}
.rc-mi {
  padding: 0.75rem 0.6rem;
  border-right: 1px solid var(--rule);
}
.rc-mi:last-child { border-right: none; }
.rc-mv {
  font-family: var(--font-serif);
  font-size: 1.2rem;
  font-weight: 400;
}
.rc-mk {
  font-size: 0.48rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--faint);
  margin-top: 0.18rem;
}
.rc-buy-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 1.2rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
}
.rc-buy-price {
  font-family: var(--font-serif);
  font-size: 2rem;
  font-weight: 300;
}
.rc-buy-btn {
  font-family: var(--font-mono);
  font-size: 0.54rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  background: var(--ink);
  color: var(--white);
  text-decoration: none;
  padding: 0.6rem 1.2rem;
  transition: background 0.2s;
}
.rc-buy-btn:hover { background: var(--pkd); }

/* ── Ticker ───────────────────────────────── */
.ticker {
  background: var(--ink);
  overflow: hidden;
  white-space: nowrap;
  padding: 0.6rem 0;
  border-bottom: 1px solid #222;
}
.ticker-track {
  display: inline-flex;
  gap: 2.5rem;
  animation: ticker-scroll 30s linear infinite;
}
@keyframes ticker-scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
.ti {
  font-size: 0.56rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.3);
}
.ti .val { color: var(--pk); }    /* Pink values in ticker */
.ti-sep  { color: rgba(255, 255, 255, 0.12); }

/* ── Stats strip ──────────────────────────── */
.stats {
  /* Mobile: 2 cols */
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-bottom: 1px solid var(--rule);
}
.stat {
  padding: 1.6rem 1rem;
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
/* Remove bottom border on last row */
.stats .stat:nth-child(3),
.stats .stat:nth-child(4) { border-bottom: none; }
/* Remove right border on right-column items */
.stats .stat:nth-child(2),
.stats .stat:nth-child(4) { border-right: none; }

.stat-n {
  font-family: var(--font-serif);
  font-size: clamp(1.6rem, 5vw, 2.4rem);
  font-weight: 300;
  line-height: 1;
}
.stat-n span { color: var(--pk); }   /* Pink digits */
.stat-bar {
  width: 16px;
  height: 1px;
  background: var(--pk);
  margin: 0.6rem 0;
}
.stat-d {
  font-size: 0.64rem;
  color: var(--mid);
  line-height: 1.55;
  font-weight: 300;
}

/* ── Chapter grid ─────────────────────────── */
.chapters {
  /* Mobile: single column */
  display: grid;
  grid-template-columns: 1fr;
  border-bottom: 1px solid var(--rule);
}
.ch {
  padding: 1.8rem 1rem;
  border-bottom: 1px solid var(--rule);
  transition: background 0.2s;
}
.ch:last-child { border-bottom: none; }
.ch:hover { background: var(--pk2); }
.ch-num {
  font-size: 0.54rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--pk);
}
.ch-title {
  font-family: var(--font-serif);
  font-size: 1rem;
  font-weight: 400;
  margin-top: 0.45rem;
  line-height: 1.35;
}
.ch-desc {
  font-size: 0.68rem;
  color: var(--mid);
  margin-top: 0.45rem;
  line-height: 1.65;
  font-weight: 300;
}

/* ── Quote band ───────────────────────────── */
.quote-band {
  background: var(--ink);
  color: var(--white);
  padding: 3rem 1rem;
  border-bottom: 1px solid var(--rule);
}
.q-attr {
  font-size: 0.52rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.28);
  line-height: 2.4;
  margin-bottom: 1.2rem;
}
.q-text {
  font-family: var(--font-serif);
  font-size: clamp(1.3rem, 4vw, 2rem);
  font-weight: 300;
  font-style: italic;
  line-height: 1.5;
}
.q-text em {
  color: var(--pk);
  font-style: normal;
}

/* ── Storefront bridge ────────────────────── */
.bridge {
  display: flex;
  flex-direction: column;
  border-bottom: 1px solid var(--rule);
}
.bridge-l {
  padding: 2.5rem 1rem;
  border-bottom: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.bridge-tag {
  font-size: 0.54rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--faint);
}
.bridge-h {
  font-family: var(--font-serif);
  font-size: clamp(1.7rem, 5vw, 2.8rem);
  font-weight: 300;
  line-height: 1.15;
}
.bridge-h em { font-style: italic; color: var(--pk); }
.bridge-body {
  font-size: 0.72rem;
  color: var(--mid);
  line-height: 1.88;
  font-weight: 300;
  max-width: 44ch;
}
.bridge-cta {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.58rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  background: var(--ink);
  color: var(--white);
  text-decoration: none;
  padding: 0.85rem 1.8rem;
  transition: background 0.2s;
  align-self: flex-start;
}
.bridge-cta:hover { background: var(--pkd); }

.bridge-r {
  background: var(--off);
  padding: 2rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.bridge-item {
  background: var(--white);
  border: 1px solid var(--rule);
  padding: 1.1rem 1.2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1px;
  transition: background 0.2s;
  text-decoration: none;
  color: inherit;
}
.bridge-item:hover { background: var(--pk2); }
.bi-brand {
  font-size: 0.5rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--pk);
}
.bi-name {
  font-family: var(--font-serif);
  font-size: 0.9rem;
  font-weight: 400;
  margin-top: 0.15rem;
}
.bi-tag {
  font-size: 0.46rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0.18rem 0.44rem;
  background: var(--pk2);
  color: var(--pkd);
  flex-shrink: 0;
}
.bridge-all {
  text-align: center;
  padding: 1rem 0;
  border-top: 1px solid var(--rule);
  margin-top: 1px;
}
.bridge-all a {
  font-size: 0.54rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--mid);
  text-decoration: none;
  transition: color 0.18s;
}
.bridge-all a:hover { color: var(--ink); }

/* ── Guide band ───────────────────────────── */
.guide-band {
  display: flex;
  flex-direction: column;
  background: var(--off);
  border-bottom: 1px solid var(--rule);
}
.gb-l {
  padding: 2.5rem 1rem;
  border-bottom: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.gb-tag {
  font-size: 0.54rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--faint);
}
.gb-h {
  font-family: var(--font-serif);
  font-size: clamp(1.7rem, 5vw, 2.5rem);
  font-weight: 300;
  line-height: 1.1;
}
.gb-h em { font-style: italic; color: var(--pk); }
.gb-body {
  font-size: 0.72rem;
  color: var(--mid);
  line-height: 1.78;
  font-weight: 300;
}
.gb-feats {
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}
.gb-feats li {
  font-size: 0.7rem;
  color: var(--mid);
  display: flex;
  align-items: flex-start;
  gap: 0.65rem;
  font-weight: 300;
  line-height: 1.5;
}
.gb-feats li::before {
  content: '';
  display: block;
  width: 11px;
  height: 1px;
  background: var(--pk);
  flex-shrink: 0;
  margin-top: 0.7rem;
}
.gb-acts {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
}
.gb-r {
  padding: 2.5rem 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
}
.price-card { text-align: center; }
.pc-note {
  font-size: 0.54rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--faint);
}
.pc-price {
  font-family: var(--font-serif);
  font-size: clamp(3.5rem, 12vw, 5rem);
  font-weight: 300;
  color: var(--pk);
  line-height: 1;
  margin-top: 0.3rem;
}
.pc-detail {
  font-size: 0.68rem;

  margin-top: 0.4rem;

/* ── Inventory hero (dark) ────────────────── */
.inv-hero {

  color: var(--white);
  padding-top: 0;
}
.ih-top {
  display: flex;
  flex-direction: column;
  gap: 2rem;

.ih-h em { font-style: italic; color: var(--pk); }

  font-size: 0.72rem;
  color: rgba(255, 255, 255, 0.45);
  line-height: 1.9;
  font-weight: 300;
}
.ih-standard {
  margin-top: 1.5rem;
  border: 1px solid rgba(255, 255, 255, 0.12);
  padding: 1.2rem;
}
.is-title {
  font-size: 0.52rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.28);

}

  gap: 1rem;

.ih-bottom-label {
  font-size: 0.52rem;

  color: rgba(255, 255, 255, 0.28);

.ih-storefront {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  font-family: var(--font-mono);
  font-size: 0.58rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  background: var(--pk);
  color: var(--white);

.ih-storefront:hover { opacity: 0.85; }

/* ── Grade strip ──────────────────────────── */
.grade-strip {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-bottom: 1px solid var(--rule);
}
.grade-item {
  padding: 1.4rem 1rem;
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);

.grade-item:nth-child(2n) { border-right: none; }
.grade-item:nth-child(5)  { border-bottom: none; border-right: none; }
.grade-letter {
  font-family: var(--font-serif);
  font-size: 1.8rem;
  font-weight: 300;
  line-height: 1;
}
.grade-item:first-child .grade-letter       { color: var(--pk); }
.grade-item:nth-child(2) .grade-letter      { color: var(--gold); }
.grade-name {
  font-size: 0.5rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--faint);
  margin-top: 0.38rem;
}
.grade-desc {
  font-size: 0.6rem;
  color: var(--mid);
  margin-top: 0.44rem;
  line-height: 1.55;
  font-weight: 300;
}
.grade-liq {
  font-size: 0.5rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 0.55rem;
}
.grade-item:first-child .grade-liq      { color: var(--pk); }
.grade-item:nth-child(2) .grade-liq     { color: var(--gold); }
.grade-liq-other                         { color: var(--faint); }
